name: Contribution snake

on:
  schedule:
    - cron: "47 2 * * *" # daily, 02:47 UTC
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/perfect-profile-readme # TEMPORARY: first verification run, removed before merge

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Palette: background #161210, empty cell #1f1a17 (panel), cell border #3a3027,
      # contribution levels step from the panel colour up to the accent #F97316,
      # snake #ffffff.
      - name: Generate the snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ffffff&color_dots=#1f1a17,#563017,#8c4717,#c35d16,#F97316&color_dot_border=#3a3027&color_background=#161210

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
