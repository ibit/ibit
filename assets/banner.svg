<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <style>
    .ui{font-family:"Segoe UI","Inter",Helvetica,Arial,sans-serif}
    .mono{font-family:"Cascadia Code",Consolas,"JetBrains Mono",monospace}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .bar{transform-origin:0 0;animation:grow .6s ease-out both}
    .a1{animation:up .6s ease-out .2s both}
    .a2{animation:up .6s ease-out .5s both}
    .a3{animation:up .6s ease-out .8s both}
    .a4{animation:up .6s ease-out 1.1s both}
    .cur{animation:blink 1.2s steps(1) 1.4s infinite}
  </style>
  <rect width="1200" height="240" rx="12" fill="#161210"/>
  <rect class="bar" x="0" y="0" width="8" height="240" fill="#F97316"/>
  <text class="ui a1" x="64" y="104" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-2">ibit</text>
  <text class="ui a2" x="64" y="146" font-size="20" fill="#d6d3d1">Web developer · CS student at Chiba Institute of Technology</text>
  <text class="mono a3" x="64" y="188" font-size="15" fill="#F97316">building small web apps, one at a time.<tspan class="cur">_</tspan></text>
  <text class="mono a4" x="1136" y="200" text-anchor="end" font-size="13" fill="#78716c">ibit.dev</text>
</svg>
