<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <style>
    .ui{font-family:"Segoe UI","Inter",Helvetica,Arial,sans-serif}
    .mono{font-family:"Cascadia Code",Consolas,"JetBrains Mono",monospace}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .bar{transform-origin:0 0;animation:grow .6s ease-out both}
    .a1{animation:up .6s ease-out .2s both}
    .a2{animation:up .6s ease-out .5s both}
    .a3{animation:up .6s ease-out .8s both}
  </style>
  <rect width="1200" height="200" rx="12" fill="#161210"/>
  <rect class="bar" x="0" y="0" width="8" height="200" fill="#F97316"/>
  <text class="ui a1" x="64" y="98" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-2">ibit</text>
  <text class="ui a2" x="64" y="142" font-size="20" fill="#d6d3d1">Web developer · Founder of Scopit · Student at Chiba Institute of Technology</text>
  <text class="mono a3" x="1136" y="170" text-anchor="end" font-size="13" fill="#78716c">ibit.dev</text>
</svg>
