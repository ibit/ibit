<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#151a2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="winbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c0c"/><stop offset="1" stop-color="#101418"/></linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.5"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.4"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/></pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
    <clipPath id="win"><rect x="48" y="48" width="720" height="304" rx="8"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/></filter>
    <style>
      @keyframes drift1{0%{transform:translate(0,0)}50%{transform:translate(60px,-30px)}100%{transform:translate(0,0)}}
      @keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-50px,40px)}100%{transform:translate(0,0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes dash{to{stroke-dashoffset:0}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes spinr{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
      @keyframes bar{0%{width:0}100%{width:214px}}
      @keyframes tick{0%,100%{opacity:0.25}50%{opacity:1}}
      .g1{animation:drift1 14s ease-in-out infinite}
      .g2{animation:drift2 18s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .l1{animation:rise .7s ease-out .2s both}
      .l2{animation:rise .7s ease-out .6s both}
      .l3{animation:rise .7s ease-out 1.0s both}
      .l4{animation:rise .7s ease-out 1.4s both}
      .l5{animation:rise .7s ease-out 1.8s both}
      .l6{animation:rise .7s ease-out 2.3s both}
      .l7{animation:rise .7s ease-out 2.7s both}
      .bar{animation:bar 1.4s ease-out 2.0s both}
      .line{stroke-dasharray:300;stroke-dashoffset:300;animation:dash 1.4s ease-out 1.2s forwards}
      .orb{animation:float 6s ease-in-out infinite}
      .ring1{transform-origin:1000px 200px;animation:spin 24s linear infinite}
      .ring2{transform-origin:1000px 200px;animation:spinr 36s linear infinite}
      .t1{animation:tick 2s ease-in-out infinite}
      .t2{animation:tick 2s ease-in-out .5s infinite}
      .t3{animation:tick 2s ease-in-out 1s infinite}
      .mono{font-family:"Cascadia Code","Cascadia Mono","JetBrains Mono","Fira Code",Consolas,monospace}
      .ui{font-family:"Segoe UI","Inter",Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <circle class="g1" cx="980" cy="80" r="280" fill="url(#glow1)"/>
    <circle class="g2" cx="200" cy="360" r="260" fill="url(#glow2)"/>
    <g class="orb">
      <g class="ring1"><circle cx="1000" cy="200" r="104" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.85" stroke-dasharray="40 14 8 14"/></g>
      <g class="ring2"><circle cx="1000" cy="200" r="74" fill="none" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="6 10"/></g>
      <circle cx="1000" cy="200" r="42" fill="url(#accent)" fill-opacity="0.16"/>
      <circle cx="1000" cy="200" r="28" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="1000" cy="200" r="7" fill="#ffffff"/>
      <circle cx="1104" cy="200" r="5" fill="#22D3EE"/>
      <circle cx="934" cy="132" r="4" fill="#A78BFA"/>
      <circle cx="1000" cy="96" r="3" fill="#ffffff" fill-opacity="0.8"/>
      <circle cx="1062" cy="286" r="3" fill="#A78BFA" fill-opacity="0.8"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="48" y="48" width="720" height="304" rx="8" fill="url(#winbg)" stroke="#2a2f3a" stroke-width="1"/>
    </g>
    <g clip-path="url(#win)">
      <rect x="48" y="48" width="720" height="36" fill="#1b1f27"/>
      <rect x="56" y="54" width="228" height="30" rx="6" fill="#0c0c0c"/>
      <rect x="56" y="82" width="228" height="2" fill="#0c0c0c"/>
      <path d="M68 61 h14 v14 h-14 z" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
      <path d="M72 66 l4 3 l-4 3" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="ui" x="92" y="73" font-size="12.5" fill="#e5e7eb">ibit — PowerShell</text>
      <text class="ui" x="268" y="73" font-size="13" fill="#9ca3af">×</text>
      <text class="ui" x="298" y="74" font-size="16" fill="#9ca3af">+</text>
      <text class="ui" x="322" y="72" font-size="11" fill="#9ca3af">⌄</text>
      <text class="ui" x="690" y="74" text-anchor="middle" font-size="14" fill="#cbd5e1">—</text>
      <rect x="722" y="61" width="10" height="10" fill="none" stroke="#cbd5e1" stroke-width="1.1"/>
      <text class="ui" x="754" y="74" text-anchor="middle" font-size="15" fill="#cbd5e1">✕</text>
      <rect x="48" y="84" width="720" height="268" fill="url(#scan)"/>
      <text class="mono l1" x="70" y="114" font-size="13" fill="#9ca3af">Windows PowerShell</text>
      <text class="mono l2" x="70" y="140" font-size="13.5"><tspan fill="#22D3EE">PS C:\Users\ibit&gt;</tspan><tspan fill="#e5e7eb"> whoami</tspan></text>
      <text class="ui l3" x="70" y="196" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">ibit</text>
      <line class="line" x1="72" y1="206" x2="372" y2="206" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
      <text class="mono l4" x="70" y="232" font-size="14" fill="#A78BFA">student @ chiba institute of technology · indie developer · vibe coder</text>
      <text class="mono l5" x="70" y="266" font-size="13.5"><tspan fill="#22D3EE">PS C:\Users\ibit&gt;</tspan><tspan fill="#e5e7eb"> Build-Project -Name BitCore -With AI</tspan></text>
      <text class="mono l6" x="70" y="292" font-size="12.5" fill="#9ca3af">Building</text>
      <rect x="150" y="283" width="214" height="9" rx="4.5" fill="#1f2430"/>
      <rect class="bar" x="150" y="283" height="9" rx="4.5" fill="url(#accent)"/>
      <text class="mono l6" x="376" y="292" font-size="12.5" fill="#22D3EE">100%</text>
      <text class="mono l7" x="70" y="322" font-size="13.5"><tspan fill="#22D3EE">PS C:\Users\ibit&gt;</tspan><tspan fill="#e5e7eb"> building things with AI, one commit at a time</tspan><tspan class="cursor" fill="#A78BFA">_</tspan></text>
    </g>
    <g class="mono" font-size="11" fill="#8b949e">
      <circle class="t1" cx="820" cy="356" r="3" fill="#A78BFA"/><text x="830" y="360">commit</text>
      <circle class="t2" cx="900" cy="356" r="3" fill="#ffffff"/><text x="910" y="360">ship</text>
      <circle class="t3" cx="960" cy="356" r="3" fill="#22D3EE"/><text x="970" y="360">repeat</text>
    </g>
    <text class="mono" x="1150" y="372" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.35">ibit.dev</text>
  </g>
</svg>
