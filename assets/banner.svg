<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#151a2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
    <style>
      @keyframes drift1{0%{transform:translate(0,0)}50%{transform:translate(60px,-30px)}100%{transform:translate(0,0)}}
      @keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-50px,40px)}100%{transform:translate(0,0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes dash{to{stroke-dashoffset:0}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .g1{animation:drift1 14s ease-in-out infinite}
      .g2{animation:drift2 18s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .l1{animation:rise .9s ease-out .2s both}
      .l2{animation:rise .9s ease-out .5s both}
      .l3{animation:rise .9s ease-out .8s both}
      .l4{animation:rise .9s ease-out 1.1s both}
      .line{stroke-dasharray:420;stroke-dashoffset:420;animation:dash 1.6s ease-out 1s forwards}
      .orb{animation:float 6s ease-in-out infinite}
      .mono{font-family:"JetBrains Mono","Fira Code","SFMono-Regular",Consolas,monospace}
      .sans{font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="g1" cx="980" cy="80" r="260" fill="url(#glow1)"/>
    <circle class="g2" cx="220" cy="330" r="240" fill="url(#glow2)"/>
    <g class="orb">
      <circle cx="1010" cy="180" r="92" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="1010" cy="180" r="62" fill="none" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="1010" cy="180" r="34" fill="url(#accent)" fill-opacity="0.18"/>
      <circle cx="1010" cy="180" r="6" fill="#ffffff"/>
      <circle cx="1102" cy="180" r="5" fill="#22D3EE"/>
      <circle cx="948" cy="118" r="4" fill="#A78BFA"/>
      <circle cx="1010" cy="88" r="3" fill="#ffffff" fill-opacity="0.8"/>
    </g>
    <rect x="60" y="56" width="640" height="248" rx="16" fill="#0d1117" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="84" cy="80" r="6" fill="#ff5f57"/>
    <circle cx="104" cy="80" r="6" fill="#febc2e"/>
    <circle cx="124" cy="80" r="6" fill="#28c840"/>
    <text class="mono" x="350" y="85" text-anchor="middle" font-size="13" fill="#8b949e">ibit — ~/profile</text>
    <text class="mono l1" x="90" y="128" font-size="15" fill="#8b949e"><tspan fill="#22D3EE">$</tspan> whoami</text>
    <text class="sans l2" x="90" y="186" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1.5">ibit</text>
    <text class="mono l3" x="90" y="222" font-size="16" fill="#A78BFA">student @ chiba institute of technology · indie developer · vibe coder</text>
    <text class="mono l4" x="90" y="268" font-size="15" fill="#8b949e"><tspan fill="#22D3EE">$</tspan> building things with AI, one commit at a time<tspan class="cursor" fill="#A78BFA">▌</tspan></text>
    <line class="line" x1="90" y1="196" x2="510" y2="196" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <text class="mono" x="1140" y="330" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.35">ibit.dev</text>
  </g>
</svg>
