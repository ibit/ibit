<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
<clipPath id="frame"><rect width="1200" height="330" rx="20"/></clipPath>
<style>
@keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.t{animation:rise .55s ease-out both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}.d7{animation-delay:.7s}.d8{animation-delay:.8s}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.mono{font-family:"Cascadia Code","JetBrains Mono","Fira Code",Consolas,monospace}
.ui{font-family:"Segoe UI","Inter",Helvetica,Arial,sans-serif}
.tile{fill:#0d1117;stroke:#30363d;stroke-width:1}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="330" fill="url(#card)"/>
<rect width="1200" height="330" fill="url(#grid)"/>
<rect x="0" y="0" width="1200" height="2" fill="url(#accent)"/>
<text class="mono t" x="40" y="44" font-size="13" fill="#8b949e"><tspan fill="#22D3EE">PS&gt;</tspan> Get-Contact -All</text>

<g class="t d1">
<rect class="tile" x="40" y="70" width="268" height="88" rx="14"/>
<rect x="60" y="92" width="44" height="44" rx="10" fill="#000000"/>
<path d="M70 102 l24 24 M94 102 l-24 24" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
<text class="ui" x="118" y="108" font-size="12" fill="#8b949e">X (Twitter)</text>
<text class="ui" x="118" y="130" font-size="18" font-weight="700" fill="#ffffff">@ibit_cit</text>
</g>

<g class="t d2">
<rect class="tile" x="324" y="70" width="268" height="88" rx="14"/>
<rect x="344" y="92" width="44" height="44" rx="10" fill="#0A66C2"/>
<text class="ui" x="366" y="124" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">in</text>
<text class="ui" x="402" y="108" font-size="12" fill="#8b949e">LinkedIn</text>
<text class="ui" x="402" y="130" font-size="18" font-weight="700" fill="#ffffff">ibit</text>
</g>

<g class="t d3">
<rect class="tile" x="608" y="70" width="268" height="88" rx="14"/>
<rect x="628" y="92" width="44" height="44" rx="10" fill="#FE7A16"/>
<path d="M640 122 v10 h20 v-10 M644 118 l14 4 M646 112 l12 7 M651 106 l9 10" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
<text class="ui" x="686" y="108" font-size="12" fill="#8b949e">Stack Overflow</text>
<text class="ui" x="686" y="130" font-size="18" font-weight="700" fill="#ffffff">ibit</text>
</g>

<g class="t d4">
<rect class="tile" x="892" y="70" width="268" height="88" rx="14"/>
<rect x="912" y="92" width="44" height="44" rx="10" fill="url(#accent)"/>
<circle cx="934" cy="114" r="12" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<path d="M922 114 h24 M934 102 c-6 7 -6 17 0 24 M934 102 c6 7 6 17 0 24" stroke="#ffffff" stroke-width="2" fill="none"/>
<text class="ui" x="970" y="108" font-size="12" fill="#8b949e">Website</text>
<text class="ui" x="970" y="130" font-size="18" font-weight="700" fill="#ffffff">ibit.dev</text>
</g>

<g class="t d5">
<rect class="tile" x="40" y="178" width="268" height="88" rx="14"/>
<rect x="60" y="200" width="44" height="44" rx="10" fill="#3EA8FF"/>
<text class="ui" x="82" y="231" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Z</text>
<text class="ui" x="118" y="216" font-size="12" fill="#8b949e">Zenn</text>
<text class="ui" x="118" y="238" font-size="18" font-weight="700" fill="#ffffff">zenn.dev/ibit</text>
</g>

<g class="t d6">
<rect class="tile" x="324" y="178" width="268" height="88" rx="14"/>
<rect x="344" y="200" width="44" height="44" rx="10" fill="#55C500"/>
<text class="ui" x="366" y="231" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Q</text>
<text class="ui" x="402" y="216" font-size="12" fill="#8b949e">Qiita</text>
<text class="ui" x="402" y="238" font-size="18" font-weight="700" fill="#ffffff">qiita.com/ibit</text>
</g>

<g class="t d7">
<rect class="tile" x="608" y="178" width="268" height="88" rx="14"/>
<rect x="628" y="200" width="44" height="44" rx="10" fill="#FFDD00"/>
<path d="M640 214 h20 l-2 16 h-16 z M660 216 h5 a4 4 0 0 1 0 8 h-6" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
<text class="ui" x="686" y="216" font-size="12" fill="#8b949e">Buy Me A Coffee</text>
<text class="ui" x="686" y="238" font-size="18" font-weight="700" fill="#ffffff">Support ☕</text>
</g>

<g class="t d8">
<rect class="tile" x="892" y="178" width="268" height="88" rx="14"/>
<rect x="912" y="200" width="44" height="44" rx="10" fill="#EA4AAA"/>
<path d="M934 236 c-10 -8 -14 -12 -14 -18 a6 6 0 0 1 12 -2 a6 6 0 0 1 12 2 c0 6 -4 10 -10 18 z" fill="#ffffff"/>
<text class="ui" x="970" y="216" font-size="12" fill="#8b949e">GitHub Sponsors</text>
<text class="ui" x="970" y="238" font-size="18" font-weight="700" fill="#ffffff">Sponsor 💜</text>
</g>

<g class="mono" font-size="12" fill="#8b949e">
<circle class="pulse" cx="48" cy="300" r="4" fill="#22D3EE"/><text x="62" y="304">DMs open — happy to talk about indie dev &amp; vibe coding</text>
<text x="1160" y="304" text-anchor="end" fill="#ffffff" fill-opacity="0.35">ibit.dev</text>
</g>
</g>
</svg>
