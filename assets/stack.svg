    <rect class="chip" x="130" y="144" width="110" height="34" rx="6"/><text x="185" y="166" text-anchor="middle">Git / GitHub</text>
    <rect class="chip" x="248" y="144" width="92" height="34" rx="6"/><text x="294" y="166" text-anchor="middle">VS Code</text>
    <rect class="chip" x="348" y="144" width="130" height="34" rx="6"/><text x="413" y="166" text-anchor="middle">GitHub Copilot</text>
  </g>
  <text class="ui" x="720" y="52" font-size="13" fill="#a8a29e">Learning</text>
