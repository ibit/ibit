<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1612"/><stop offset="1" stop-color="#0f0d0b"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="20"/></clipPath>
    <style>
      .mono{font-family:"Cascadia Code","JetBrains Mono","Fira Code",Consolas,monospace}
      .ui{font-family:"Segoe UI","Inter",Helvetica,Arial,sans-serif}
      .chip{fill:#0f0d0b;stroke:#3a3027}
      .chipm{fill:#F97316;fill-opacity:0.14;stroke:#F97316;stroke-opacity:0.7}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#card)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#accent)"/>
    <text class="mono" x="40" y="44" font-size="13" fill="#8b949e"><tspan fill="#FBBF24">PS&gt;</tspan> Get-Stack</text>

    <text class="ui" x="40" y="86" font-size="12" font-weight="600" fill="#F97316" letter-spacing="1.5">MAIN · WEB</text>
    <g class="ui" font-size="14" font-weight="600" fill="#ffffff">
      <rect class="chipm" x="40" y="98" width="110" height="34" rx="8"/><text x="95" y="120" text-anchor="middle">TypeScript</text>
      <rect class="chipm" x="158" y="98" width="96" height="34" rx="8"/><text x="206" y="120" text-anchor="middle">JavaScript</text>
      <rect class="chipm" x="262" y="98" width="76" height="34" rx="8"/><text x="300" y="120" text-anchor="middle">React</text>
      <rect class="chipm" x="346" y="98" width="86" height="34" rx="8"/><text x="389" y="120" text-anchor="middle">Next.js</text>
      <rect class="chipm" x="440" y="98" width="86" height="34" rx="8"/><text x="483" y="120" text-anchor="middle">Node.js</text>
      <rect class="chipm" x="534" y="98" width="110" height="34" rx="8"/><text x="589" y="120" text-anchor="middle">HTML / CSS</text>
    </g>

    <text class="ui" x="40" y="166" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1.5">ALSO USE</text>
    <g class="ui" font-size="14" fill="#e5e7eb">
      <rect class="chip" x="40" y="178" width="82" height="34" rx="8"/><text x="81" y="200" text-anchor="middle">Python</text>
      <rect class="chip" x="130" y="178" width="110" height="34" rx="8"/><text x="185" y="200" text-anchor="middle">Git / GitHub</text>
      <rect class="chip" x="248" y="178" width="92" height="34" rx="8"/><text x="294" y="200" text-anchor="middle">VS Code</text>
      <rect class="chip" x="348" y="178" width="112" height="34" rx="8"/><text x="404" y="200" text-anchor="middle">PowerShell</text>
      <rect class="chip" x="468" y="178" width="130" height="34" rx="8"/><text x="533" y="200" text-anchor="middle">GitHub Copilot</text>
    </g>

    <text class="ui" x="700" y="86" font-size="12" font-weight="600" fill="#FBBF24" letter-spacing="1.5">LEARNING</text>
    <g class="ui" font-size="14" fill="#e5e7eb">
      <rect class="chip" x="700" y="98" width="118" height="34" rx="8" stroke-dasharray="4 3"/><text x="759" y="120" text-anchor="middle">AI / LLM API</text>
      <rect class="chip" x="826" y="98" width="82" height="34" rx="8" stroke-dasharray="4 3"/><text x="867" y="120" text-anchor="middle">Docker</text>
      <rect class="chip" x="916" y="98" width="110" height="34" rx="8" stroke-dasharray="4 3"/><text x="971" y="120" text-anchor="middle">Supabase</text>
    </g>

    <text class="ui" x="700" y="166" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1.5">FOCUS</text>
    <text class="ui" x="700" y="194" font-size="14" fill="#cbd5e1">Web apps first. Still a student —</text>
    <text class="ui" x="700" y="214" font-size="14" fill="#cbd5e1">learning by shipping small things.</text>

    <text class="mono" x="1160" y="244" text-anchor="end" font-size="11" fill="#ffffff" fill-opacity="0.35">honest version · 2026</text>
  </g>
</svg>
