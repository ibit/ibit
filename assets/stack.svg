    <rect class="chip" x="720" y="64" width="118" height="34" rx="6"/><text x="779" y="86" text-anchor="middle">AI / LLM API</text>
    <rect class="chip" x="846" y="64" width="82" height="34" rx="6"/><text x="887" y="86" text-anchor="middle">Docker</text>
    <rect class="chip" x="936" y="64" width="110" height="34" rx="6"/><text x="991" y="86" text-anchor="middle">Supabase</text>
