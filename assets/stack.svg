<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <style>
    .ui{font-family:"Segoe UI","Inter",Helvetica,Arial,sans-serif}
    .chip{fill:#1f1a17;stroke:#3a3027}
    .main{fill:#F97316}
    @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .c{animation:up .45s ease-out both}
    .d0{animation-delay:.05s}.d1{animation-delay:.12s}.d2{animation-delay:.19s}.d3{animation-delay:.26s}.d4{animation-delay:.33s}.d5{animation-delay:.40s}
    .d6{animation-delay:.50s}.d7{animation-delay:.57s}.d8{animation-delay:.64s}.d9{animation-delay:.71s}
    .d10{animation-delay:.80s}.d11{animation-delay:.87s}.d12{animation-delay:.94s}
  </style>
  <rect width="1200" height="200" rx="12" fill="#161210"/>
  <text class="ui" x="40" y="52" font-size="13" fill="#a8a29e">Main</text>
  <g class="ui" font-size="14" font-weight="600" fill="#161210">
    <g class="c d0"><rect class="main" x="40" y="64" width="110" height="34" rx="6"/><text x="95" y="86" text-anchor="middle">TypeScript</text></g>
    <g class="c d1"><rect class="main" x="158" y="64" width="96" height="34" rx="6"/><text x="206" y="86" text-anchor="middle">JavaScript</text></g>
    <g class="c d2"><rect class="main" x="262" y="64" width="76" height="34" rx="6"/><text x="300" y="86" text-anchor="middle">React</text></g>
    <g class="c d3"><rect class="main" x="346" y="64" width="86" height="34" rx="6"/><text x="389" y="86" text-anchor="middle">Next.js</text></g>
    <g class="c d4"><rect class="main" x="440" y="64" width="86" height="34" rx="6"/><text x="483" y="86" text-anchor="middle">Node.js</text></g>
    <g class="c d5"><rect class="main" x="534" y="64" width="110" height="34" rx="6"/><text x="589" y="86" text-anchor="middle">HTML / CSS</text></g>
  </g>
  <text class="ui" x="40" y="132" font-size="13" fill="#a8a29e">Also use</text>
  <g class="ui" font-size="14" fill="#e7e5e4">
    <g class="c d6"><rect class="chip" x="40" y="144" width="82" height="34" rx="6"/><text x="81" y="166" text-anchor="middle">Python</text></g>
    <g class="c d7"><rect class="chip" x="130" y="144" width="110" height="34" rx="6"/><text x="185" y="166" text-anchor="middle">Git / GitHub</text></g>
    <g class="c d8"><rect class="chip" x="248" y="144" width="92" height="34" rx="6"/><text x="294" y="166" text-anchor="middle">VS Code</text></g>
    <g class="c d9"><rect class="chip" x="348" y="144" width="130" height="34" rx="6"/><text x="413" y="166" text-anchor="middle">GitHub Copilot</text></g>
  </g>
  <text class="ui" x="720" y="52" font-size="13" fill="#a8a29e">Learning</text>
  <g class="ui" font-size="14" fill="#e7e5e4">
    <g class="c d10"><rect class="chip" x="720" y="64" width="118" height="34" rx="6"/><text x="779" y="86" text-anchor="middle">AI / LLM API</text></g>
    <g class="c d11"><rect class="chip" x="846" y="64" width="82" height="34" rx="6"/><text x="887" y="86" text-anchor="middle">Docker</text></g>
    <g class="c d12"><rect class="chip" x="936" y="64" width="110" height="34" rx="6"/><text x="991" y="86" text-anchor="middle">Supabase</text></g>
  </g>
</svg>
