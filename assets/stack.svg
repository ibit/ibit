<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <style>
    .ui{font-family:"Segoe UI","Inter",Helvetica,Arial,sans-serif}
    .chip{fill:#1f1a17;stroke:#3a3027}
    .hi{fill:#1f1a17;stroke:#F97316}
    .main{fill:#F97316}
    @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .c{animation:up .45s ease-out both}
    .d0{animation-delay:.05s}.d1{animation-delay:.12s}.d2{animation-delay:.19s}.d3{animation-delay:.26s}.d4{animation-delay:.33s}
    .d5{animation-delay:.43s}.d6{animation-delay:.50s}.d7{animation-delay:.57s}.d8{animation-delay:.64s}.d9{animation-delay:.71s}.d10{animation-delay:.78s}
    .d11{animation-delay:.88s}.d12{animation-delay:.95s}.d13{animation-delay:1.05s}
  </style>
  <rect width="1200" height="200" rx="12" fill="#161210"/>
  <text class="ui" x="40" y="52" font-size="13" fill="#a8a29e">Main</text>
  <g class="ui" font-size="14" font-weight="600" fill="#161210">
    <g class="c d0"><rect class="main" x="40" y="64" width="110" height="34" rx="6"/><text x="95" y="86" text-anchor="middle">TypeScript</text></g>
    <g class="c d1"><rect class="main" x="158" y="64" width="106" height="34" rx="6"/><text x="211" y="86" text-anchor="middle">JavaScript</text></g>
    <g class="c d2"><rect class="main" x="272" y="64" width="76" height="34" rx="6"/><text x="310" y="86" text-anchor="middle">React</text></g>
    <g class="c d3"><rect class="main" x="356" y="64" width="86" height="34" rx="6"/><text x="399" y="86" text-anchor="middle">Next.js</text></g>
    <g class="c d4"><rect class="main" x="450" y="64" width="118" height="34" rx="6"/><text x="509" y="86" text-anchor="middle">HTML / CSS</text></g>
  </g>
  <text class="ui" x="40" y="132" font-size="13" fill="#a8a29e">Also use</text>
  <g class="ui" font-size="14" fill="#e7e5e4">
    <g class="c d5"><rect class="chip" x="40" y="144" width="82" height="34" rx="6"/><text x="81" y="166" text-anchor="middle">Python</text></g>
    <g class="c d6"><rect class="chip" x="130" y="144" width="64" height="34" rx="6"/><text x="162" y="166" text-anchor="middle">PHP</text></g>
    <g class="c d7"><rect class="chip" x="202" y="144" width="86" height="34" rx="6"/><text x="245" y="166" text-anchor="middle">Node.js</text></g>
    <g class="c d8"><rect class="chip" x="296" y="144" width="100" height="34" rx="6"/><text x="346" y="166" text-anchor="middle">Discord.js</text></g>
    <g class="c d9"><rect class="chip" x="404" y="144" width="164" height="34" rx="6"/><text x="486" y="166" text-anchor="middle">Google Apps Script</text></g>
    <g class="c d10"><rect class="chip" x="576" y="144" width="82" height="34" rx="6"/><text x="617" y="166" text-anchor="middle">Docker</text></g>
  </g>
  <text class="ui" x="720" y="52" font-size="13" fill="#a8a29e">Workflow</text>
  <g class="ui" font-size="14" fill="#e7e5e4">
    <g class="c d11"><rect class="hi" x="720" y="64" width="120" height="34" rx="6"/><text x="780" y="86" text-anchor="middle">Claude Code</text></g>
    <g class="c d12"><rect class="chip" x="848" y="64" width="114" height="34" rx="6"/><text x="905" y="86" text-anchor="middle">Git / GitHub</text></g>
  </g>
  <text class="ui" x="720" y="132" font-size="13" fill="#a8a29e">Exploring</text>
  <g class="ui" font-size="14" fill="#e7e5e4">
    <g class="c d13"><rect class="chip" x="720" y="144" width="126" height="34" rx="6"/><text x="783" y="166" text-anchor="middle">Cybersecurity</text></g>
  </g>
</svg>
