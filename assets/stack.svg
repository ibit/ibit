    <rect class="main" x="158" y="64" width="96" height="34" rx="6"/><text x="206" y="86" text-anchor="middle">JavaScript</text>
    <rect class="main" x="262" y="64" width="76" height="34" rx="6"/><text x="300" y="86" text-anchor="middle">React</text>
    <rect class="main" x="346" y="64" width="86" height="34" rx="6"/><text x="389" y="86" text-anchor="middle">Next.js</text>
    <rect class="main" x="440" y="64" width="86" height="34" rx="6"/><text x="483" y="86" text-anchor="middle">Node.js</text>
